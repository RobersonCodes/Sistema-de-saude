############################################
# DATABASE
############################################

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saude_municipal_sl}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

############################################
# SWAGGER / OPENAPI
############################################

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

############################################
# OPENAI
############################################

openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

############################################
# JWT SECURITY
############################################

# Em produção, defina a variável de ambiente JWT_SECRET com uma chave
# aleatória de pelo menos 256 bits (ex.: openssl rand -base64 64).
# O valor abaixo é apenas um fallback de desenvolvimento local.
jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao-troque-esta-chave-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

############################################
# SERVER
############################################

server.port=8080

############################################
# LOG
############################################

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE